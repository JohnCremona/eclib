name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        cc: [gcc, clang]
        mpfp: [enable-mpfp]
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v4
    - name: Show compilers
      run: |
        "$CC" --version
        "$CXX" --version
    - name: configure
      run: |
        sudo apt-get install libpari-dev pari-gp2c libntl-dev libmpfr-dev
        wget https://flintlib.org/download/flint-3.5.0.tar.gz
        tar xf flint-3.5.0.tar.gz
        cd flint-3.5.0
        ./configure
        make -j 8
        sudo make install
        sudo ldconfig
        cd ..
        ./autogen.sh
        ./configure --with-boost="no" --with-flint --with-ntl --disable-allprogs --${{ matrix.mpfp }}
    - name: make
      run: make
    - name: make check
      run: make check
