name: conda C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.os }} with ${{ matrix.mpfp }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-latest"]
        mpfp: [enable-mpfp]

    steps:
    - uses: actions/checkout@v4
    - name: Install Xcode command-line tools
      run: |
        xcode-select --install || true
        sudo xcode-select --switch /Library/Developer/CommandLineTools
        sudo xcode-select --reset
        # Verify compiler installation
        clang --version
        
    - uses: conda-incubator/setup-miniconda@v2
      with:
        miniforge-version: latest
        mamba-version: "*"
        activate-environment: eclib-deps
        
    - name: configure
      shell: bash -el {0}
      run: |
        mamba install "pari>=2.16" ntl libflint compilers automake autoconf m4 libtool
        #conda activate eclib-deps
        export CC=$CONDA_PREFIX/bin/clang
        export CXX=$CONDA_PREFIX/bin/clang++
        export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
        export DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib:$DYLD_LIBRARY_PATH"  # Critical for macOS linking
        export MACOSX_DEPLOYMENT_TARGET=10.9  # Ensure compatibility
        export LDFLAGS="$LDFLAGS -L/usr/lib -L/usr/local/lib"
        export CFLAGS="-I$CONDA_PREFIX/include -fPIC"
        export CXXFLAGS="-I$CONDA_PREFIX/include -fPIC"
        export LDFLAGS="-L$CONDA_PREFIX/lib -L/usr/lib -L/usr/local/lib -Wl,-rpath,$CONDA_PREFIX/lib"
        ./autogen.sh
        ./configure --with-boost="no" --with-flint --with-ntl=$CONDA_PREFIX --disable-allprogs --${{ matrix.mpfp }}
        cat config.log
    - name: make
      shell: bash -el {0}
      run: make
    - name: make check
      shell: bash -el {0}
      run: make check
